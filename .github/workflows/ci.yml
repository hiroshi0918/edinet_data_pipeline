name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: edinet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d edinet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # conftest.py の二重ガード (TEST_DATABASE_URL + DB 名に "test" を含むこと) に
      # 合わせて、CI でも専用 test DB を使う。DATABASE_URL は alembic/env.py が
      # 参照するため同じ URL を渡す。
      DATABASE_URL: postgresql://user:password@localhost:5432/edinet_test
      TEST_DATABASE_URL: postgresql://user:password@localhost:5432/edinet_test
      EDINET_API_KEY: dummy-edinet-key
      PROCESS_SLEEP_SECONDS: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ダッシュボードのテストは streamlit / plotly を import する。
          pip install -e '.[dev,viz]'

      - name: Run migrations
        run: alembic upgrade head

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # gitleaks は対象コミットの親との差分を見る。depth 1 だと親が無く scan 自体が失敗する。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
